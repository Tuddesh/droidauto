name: droidauto
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - tk
  - numpy>=2,<3
  - scipy>=1.14,<2
  - opencv>=4.13,<5
  - matplotlib
  - pillow
  - pip
  - pip:
      - zerorpc==0.6.3
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1+cu130
      - warp-lang==1.18.0
      - nvidia-curobo[cu13] @ git+https://github.com/NVlabs/curobo.git@b29a8c2ee6869585bb05b056b9ab53b9c0753106
